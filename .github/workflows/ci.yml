name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-and-test:
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Swift version
        run: swift --version

      - name: Run tests
        run: swift test

      - name: Build app bundle
        run: ./build.sh

      - name: Upload KeepAwake.app artifact
        uses: actions/upload-artifact@v4
        with:
          name: KeepAwake-app-${{ github.sha }}
          path: KeepAwake.app
          if-no-files-found: error
